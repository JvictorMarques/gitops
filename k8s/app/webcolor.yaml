apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webcolor
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JvictorMarques/gitops
    path: k8s/manifests
    targetRevision: HEAD
  destination:
    namespace: webcolor
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: 
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  minReadySeconds: 30
  strategy:
    blueGreen:
      activeService: webpage-active
      previewService: webpage-preview
      autoPromotionEnabled: false
      autoPromotionSeconds: 30
      scaleDownDelaySeconds: 60