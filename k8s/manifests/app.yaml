apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: webpage
spec:
  replicas: 5
  selector:
    matchLabels:
      app: webpage
  template:
    metadata:
      labels:
        app: webpage
    spec:
      containers:
      - name: webpage
        image: fabricioveronez/pagina-exemplo:green
        ports:
        - containerPort: 80
  minReadySeconds: 30
  strategy:
    canary:
      steps:
      - setWeight: 25
      - pause: { duration: 1m }
      - setWeight: 50
      - pause: { duration: 1m }
      - setWeight: 75
      - pause: { duration: 1m }
      - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: webpage
spec:
  selector:
    app: webpage
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30000
  type: NodePort