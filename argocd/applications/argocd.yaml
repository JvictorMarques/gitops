apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 9.5.15
      helm:
        releaseName: argocd
        valueFiles:
          - $values/gitops/values/argocd.yaml
    - repoURL: https://github.com/JvictorMarques/gitops
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/JvictorMarques/gitops  # mesmo repo
      targetRevision: HEAD
      path: k8s/manifests
      directory:
        recurse: true
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc