apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JvictorMarques/gitops
    path: k8s
    targetRevision: HEAD
  destination:
    namespace: webcolor
    server: https://kubernetes.default.svc